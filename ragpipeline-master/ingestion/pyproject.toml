[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "visionary-ingestion"
version = "1.0.0"
description = "Visionary RAG Pipeline - PDF Ingestion and Processing"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Proprietary"}
authors = [
    {name = "Visionary Engineering", email = "engineering@visionary.edu"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: Proprietary",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
]

dependencies = [
    # PDF Processing
    "PyMuPDF>=1.23.0",      # fitz - font detection, text extraction
    "pdfplumber>=0.10.0",    # table extraction with bbox
    "pymupdf4llm>=0.0.4",    # Markdown conversion
    
    # Keyword Extraction
    "yake>=0.4.8",          # Unsupervised keyword extraction
    
    # Embeddings
    "google-cloud-aiplatform>=1.40.0",  # Vertex AI embeddings
    
    # Database
    "psycopg[binary]>=3.1.18",  # PostgreSQL async driver
    "pgvector>=0.2.4",       # Vector type support
    
    # Utilities
    "tenacity>=8.2.0",       # Retry logic for API calls
    "structlog>=24.1.0",     # Structured logging
    "pydantic>=2.5.0",       # Data validation
    "pydantic-settings>=2.1.0",  # Settings management
    
    # Async support
    "asyncio>=3.4.3",
    "aiohttp>=3.9.0",        # Async HTTP client
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "black>=23.12.0",
    "ruff>=0.1.0",
    "mypy>=1.7.0",
]

[project.scripts]
visionary-ingest = "ingestion.pipeline:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["ingestion*"]

[tool.black]
line-length = 100
target-version = ["py311"]
include = '\.pyi?$'

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "W", "I", "N", "B", "C4"]
ignore = ["E501"]  # Line length handled by black

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["ingestion/tests"]
python_files = "test_*.py"
python_functions = "test_*"
addopts = "-v --cov=ingestion --cov-report=term-missing"
