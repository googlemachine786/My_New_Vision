name: Deploy to UAT

on:
  workflow_dispatch:   # manual only — no auto deploy on push

jobs:
  deploy-backend:
    name: Deploy Backend to GCP VM
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            cd ~/visionary-dev

            git pull origin main

            cd backend

            npm install
            npx prisma generate
            npx prisma migrate deploy

            npm run build

            pm2 restart visionary-backend || pm2 start dist/src/main.js --name visionary-backend

            pm2 save

            echo "✅ Backend deployed successfully"

  deploy-frontend:
    name: Deploy Frontend to GCP VM
    runs-on: ubuntu-latest
    needs: deploy-backend

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            cd ~/visionary-dev/frontend

            npm install

            npm run build

            pm2 restart visionary-frontend || pm2 start npm --name visionary-frontend -- start -- -p 3000

            pm2 save

            echo "✅ Frontend deployed successfully"
